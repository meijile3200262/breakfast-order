<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>美吉樂早餐｜廚房做菜區</title>
<style>
:root{--ink:#242424;--muted:#777;--line:#e9e9e9;--accent:#d97736;--bg:#f7f7f7;--green:#25845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:3}.wrap{max-width:1100px;margin:auto}h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:22px auto;padding:0 16px}.panel,.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;margin:7px 0 12px}button{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{background:#fff1e5;color:#9b4d18;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}
.meta{color:var(--muted);font-size:14px;margin:8px 0}.line{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.name{font-size:20px;font-weight:900}.note{background:#fff8df;border-radius:10px;padding:10px;margin:10px 0;white-space:pre-wrap}.empty{text-align:center;padding:50px 15px;color:var(--muted);background:white;border:1px dashed #ddd;border-radius:16px}
.hidden{display:none!important}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 18px;border-radius:10px;display:none}
@media(max-width:600px){h1{font-size:20px}main{padding:0 10px}}
</style></head><body>
<header><div class="wrap top"><div><h1>🍳 美吉樂早餐｜廚房做菜區</h1><div class="sub">只顯示櫃台已設為「製作中」的訂單；完成後按「可取餐」。</div></div><div class="pill" id="count">製作中 0 筆</div></div></header>
<main>
<section id="login" class="panel"><h2>廚房登入</h2><label>管理員密碼</label><input id="password" type="password" placeholder="輸入店家管理員密碼"><button id="loginBtn">登入廚房</button><p class="sub">使用與櫃台相同的管理員密碼。</p></section>
<section id="board" class="hidden"><div class="top" style="margin-bottom:14px"><div><b>製作中的訂單</b><div class="sub">每 5 秒自動更新</div></div><button id="refresh" type="button">立即刷新</button></div><div id="orders" class="grid"></div></section>
</main><div id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzWhZ_9Wi8acFohuSJo0dN3iUuKRJ7YsDImjxPe99cAymFHqUPP4MB1dZYXltONMMz6AA/exec';const $=id=>document.getElementById(id);let adminKey="",seen=[];
const money=n=>"NT$"+Number(n||0).toLocaleString("zh-TW");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function api(action,data={},method="POST"){let url=API_URL,opts={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data,adminKey})};if(method==="GET"){const u=new URL(API_URL);Object.entries({action,...data,adminKey}).forEach(([k,v])=>u.searchParams.set(k,v));url=u.toString();opts={method:"GET"}}const res=await fetch(url,opts);const j=await res.json();if(!j.ok)throw Error(j.error||"伺服器錯誤");return j}
function orderCard(o){return `<article class="order"><div class="top"><span class="name">${esc(o.name)}｜${esc(o.id)}</span><span class="pill">製作中</span></div><div class="meta">取餐：${esc(o.pickupTime||"未指定")}｜${esc(o.pickup||"")}<br>電話：${esc(o.phone)}｜下單：${new Date(o.createdAt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</div>${(o.items||[]).map(i=>`<div class="line"><div><b>${esc(i.name)} × ${Number(i.qty||0)}</b>${i.optionText?`<div class="meta">${esc(i.optionText)}</div>`:""}${i.itemNote?`<div class="meta">單品備註：${esc(i.itemNote)}</div>`:""}</div><b>${money(Number(i.price)*Number(i.qty))}</b></div>`).join("")}<div class="meta">總額：<b>${money(o.total)}</b></div>${o.note?`<div class="note">整筆備註：${esc(o.note)}</div>`:""}<button data-picked="${esc(o.id)}" style="width:100%;margin-top:10px">✓ 可取餐</button></article>`}
async function refresh(){if(!adminKey)return;try{const j=await api("orders"),list=(j.orders||[]).filter(o=>o.status==="製作中");$('count').textContent=`製作中 ${list.length} 筆`;$('orders').innerHTML=list.length?list.map(orderCard).join(""):'<div class="empty">目前沒有製作中的訂單</div>';document.querySelectorAll('[data-picked]').forEach(b=>b.onclick=async()=>{if(!confirm('確定將這筆訂單標記為「可取餐」？'))return;b.disabled=true;try{await api('updateStatus',{id:b.dataset.picked,status:'可取餐'});toast('已更新為可取餐');await refresh()}catch(e){b.disabled=false;toast(e.message)}})}catch(e){$('orders').textContent='讀取失敗：'+e.message}}
$('loginBtn').onclick=async()=>{const pw=$('password').value;if(!pw)return toast('請輸入管理員密碼');adminKey=pw;try{await api('login');$('login').classList.add('hidden');$('board').classList.remove('hidden');await refresh();setInterval(refresh,5000)}catch(e){adminKey='';toast('登入失敗：'+e.message)}};
$('refresh').onclick=refresh;
</script></body></html>
